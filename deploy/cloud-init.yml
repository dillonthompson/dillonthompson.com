#cloud-config
# Cloud-init config passed to Hetzner on server creation (via OpenTofu).
# Runs once on first boot and leaves the server ready to accept a deploy.
#
# This config assumes two template variables that OpenTofu will substitute in:
#   ${ssh_public_key}         – your personal SSH public key (for manual access)
#   ${deploy_ssh_public_key}  – the CI deploy key (from GitHub secret counterpart)
#
# The counterpart private key lives in GitHub Secrets as SSH_PRIVATE_KEY.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - ufw
  - unattended-upgrades
  - apt-transport-https

users:
  # Personal account — can sudo, logs in with your primary SSH key.
  - name: dillon
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

  # Deploy account — used by GitHub Actions. Has sudo only for the specific
  # commands the deploy workflow needs. No interactive shell access beyond
  # running those commands.
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    # Constrained sudoers entry written out below via write_files.
    ssh_authorized_keys:
      - ${deploy_ssh_public_key}

write_files:
  # Only these specific commands can be run with sudo by the deploy user.
  # Anything else (package installs, arbitrary shell) requires the personal account.
  - path: /etc/sudoers.d/deploy
    permissions: "0440"
    content: |
      # Install the freshly-uploaded env file from /tmp into its permanent home.
      deploy ALL=(root) NOPASSWD: /usr/bin/install -m 600 -o root -g root /tmp/dillonthompson.env /opt/dillonthompson/.env
      # Snapshot current env before overwrite, and roll back from snapshot on failure.
      deploy ALL=(root) NOPASSWD: /usr/bin/install -m 600 -o root -g root /opt/dillonthompson/.env /opt/dillonthompson/.env.prev
      deploy ALL=(root) NOPASSWD: /usr/bin/install -m 600 -o root -g root /opt/dillonthompson/.env.prev /opt/dillonthompson/.env
      # Clear the snapshot after a successful deploy.
      deploy ALL=(root) NOPASSWD: /bin/rm -f /opt/dillonthompson/.env.prev
      # Pull images from our GHCR repo only.
      deploy ALL=(root) NOPASSWD: /usr/bin/docker pull ghcr.io/dillonthompson/*
      # systemd control for the app unit.
      deploy ALL=(root) NOPASSWD: /bin/systemctl restart dillonthompson.service
      deploy ALL=(root) NOPASSWD: /bin/systemctl status dillonthompson.service --no-pager

  # Harden SSH: key-only auth, no root login, no password auth.
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      ChallengeResponseAuthentication no
      UsePAM yes
      X11Forwarding no
      AllowUsers dillon deploy

  # Nightly unattended security updates. Reboots only if a kernel update
  # demands it, and only at 4am local.
  - path: /etc/apt/apt.conf.d/51-unattended-upgrades-local
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";

  # systemd unit file — copied from the repo by hand into this cloud-init.
  # OpenTofu will rewrite this on each `apply` by reading deploy/dillonthompson.service.
  - path: /etc/systemd/system/dillonthompson.service
    permissions: "0644"
    content: |
      ${systemd_unit}

runcmd:
  # --- Firewall ---------------------------------------------------------------
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS (TCP for HTTP/1.1 and HTTP/2)'
  - ufw allow 443/udp comment 'HTTPS/3 (QUIC)'
  - ufw --force enable

  # --- Docker (official apt repo) --------------------------------------------
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
      | tee /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
  - systemctl enable --now docker

  # --- App directory ---------------------------------------------------------
  - install -d -m 0755 -o root -g root /opt/dillonthompson

  # --- SSH daemon restart to apply hardening ---------------------------------
  - systemctl restart ssh

  # --- systemd: pick up the new unit file ------------------------------------
  # Don't start the service yet — no IMAGE is set. First deploy from CI populates
  # /opt/dillonthompson/.env and calls `systemctl restart`.
  - systemctl daemon-reload
  - systemctl enable dillonthompson.service

final_message: "dillonthompson.com server provisioned. Awaiting first deploy."
