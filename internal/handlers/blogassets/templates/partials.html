{{define "head"}}<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
<meta name="author" content="Dillon Thompson">
<link rel="canonical" href="{{.Canonical}}">
<link rel="alternate" type="application/rss+xml" title="Dillon Thompson" href="{{.SiteURL}}/rss.xml">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:type" content="{{.OGType}}">
<meta property="og:url" content="{{.Canonical}}">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:image" content="{{.SiteURL}}/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.Title}}">
<meta name="twitter:description" content="{{.Description}}">
<meta name="twitter:image" content="{{.SiteURL}}/og-image.png">
{{if .PublishedISO}}<meta property="article:published_time" content="{{.PublishedISO}}">{{end}}
<script src="/blog/assets/theme.js"></script>
<script src="/blog/assets/terminal.js" defer></script>
<link rel="preload" href="/blog/assets/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/blog/assets/blog.css">
<link rel="stylesheet" href="/blog/assets/syntax.css">
</head>
<body class="blog">
<header class="blog-header"><div class="blog-header-inner">
<div class="term-wrap"><div class="term">
<div class="term-bar" id="term-bar">
<span class="term-prompt">~$</span>
<input class="term-input" id="term-input" placeholder="type a command..." spellcheck="false" autocomplete="off" aria-label="Command bar">
<kbd class="term-kbd">&#8984;K</kbd>
</div>
<div class="term-out" id="term-out" hidden></div>
</div></div>
<button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme">
<svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
<svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
</button>
</div></header>
<main class="blog-main">{{end}}

{{define "foot"}}</main>
<footer class="blog-footer"><span>&copy; Dillon Thompson</span><a href="/rss.xml">RSS</a></footer>
</body>
</html>{{end}}
