{{define "head"}}<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<meta name="description" content="{{.Description}}">
<meta name="author" content="Dillon Thompson">
<link rel="canonical" href="{{.Canonical}}">
<link rel="alternate" type="application/rss+xml" title="Dillon Thompson" href="{{.SiteURL}}/rss.xml">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#07162c">
<meta property="og:type" content="{{.OGType}}">
<meta property="og:url" content="{{.Canonical}}">
<meta property="og:title" content="{{.Title}}">
<meta property="og:description" content="{{.Description}}">
<meta property="og:image" content="{{.SiteURL}}/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.Title}}">
<meta name="twitter:description" content="{{.Description}}">
<meta name="twitter:image" content="{{.SiteURL}}/og-image.png">
{{if .PublishedISO}}<meta property="article:published_time" content="{{.PublishedISO}}">{{end}}
<script src="{{asset "theme.js"}}"></script>
<script src="{{asset "terminal.js"}}" defer></script>
<link rel="preload" href="/blog/assets/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{asset "blog.css"}}">
<link rel="stylesheet" href="{{asset "syntax.css"}}">
</head>
<body class="blog">
<header class="blog-header"><div class="blog-header-inner">
<div class="term-wrap"><div class="term">
<div class="term-bar" id="term-bar">
<span class="term-prompt">~$</span>
<input class="term-input" id="term-input" placeholder="type a command..." spellcheck="false" autocomplete="off" aria-label="Command bar">
<kbd class="term-kbd">&#8984;K</kbd>
</div>
<div class="term-out" id="term-out" hidden></div>
</div></div>
<button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch to sunrise theme" title="Toggle sunrise / sunset">
<svg class="icon-sunrise" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41M2 18h2M20 18h2m-.93-7.07-1.41 1.41M22 22H2"/><path d="M16 18a4 4 0 0 0-8 0"/><path d="m8 6 4-4 4 4"/></svg>
<svg class="icon-sunset" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10V2"/><path d="m4.93 10.93 1.41 1.41M2 18h2M20 18h2m-.93-7.07-1.41 1.41M22 22H2"/><path d="M16 18a4 4 0 0 0-8 0"/><path d="m16 6-4 4-4-4"/></svg>
</button>
</div></header>
<main class="blog-main">{{end}}

{{define "foot"}}</main>
<footer class="blog-footer"><span>&copy; Dillon Thompson</span><a href="/rss.xml">RSS</a></footer>
</body>
</html>{{end}}
