# Production-like stack: Caddy fronts a compiled Go API and a built React bundle.
# Run with: docker compose -f docker-compose.prod.yml up --build
# Then hit http://localhost to exercise the full reverse-proxy flow.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dillonthompson}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dillonthompson}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dillonthompson}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-dillonthompson}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dillonthompson}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
