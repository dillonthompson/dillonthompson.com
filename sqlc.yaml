version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/repository/queries.sql"
    schema: "internal/migrations/"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "uuid"
            go_type: "string"
          - db_type: "text[]"
            go_type:
              import: "github.com/lib/pq"
              type: "StringArray"
